# GitHub actions - Create Tesseract installer for Windows

name: Cross build for Windows

# Show the MSYS2 environment in the list of workflow runs.
run-name: Cross build for Windows (${{ inputs.msystem }})

on:
  # Trigger workflow in GitHub web frontend or from API.
  workflow_dispatch:
    inputs:
      msystem:
        description: 'MSYS2 environment'
        required: true
        default: 'CLANG64'
        type: choice
        options:
          - 'CLANG64'
          - 'UCRT64'
          - 'CLANGARM64'

jobs:
  build64:
    name: Installer (${{ inputs.msystem }})
    runs-on: [ubuntu-24.04]
    steps:
    - uses: actions/checkout@v7
    - name: Install llvm-mingw and MSYS2 packages
      id: cross
      uses: ./.github/actions/setup-msys2-cross
      with:
        msystem: ${{ inputs.msystem }}
        packages: >-
          curl-winssl giflib icu leptonica libarchive libidn2 openjpeg2
          openssl pango libpng libtiff libwebp
    - name: Build Tesseract installer
      run: nsis/build.sh "$HOST" "$PREFIX"
      env:
        HOST: ${{ steps.cross.outputs.host }}
        PREFIX: ${{ steps.cross.outputs.prefix }}
    - uses: actions/upload-artifact@v7
      with:
        name: Tesseract Installer for Windows (${{ inputs.msystem }})
        path: bin/ndebug/${{ steps.cross.outputs.host }}/nsis/tesseract-ocr-*-setup-*.exe
        archive: false
