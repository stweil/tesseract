# GitHub action - Set up a cross build environment for Windows

name: Set up MSYS2 cross build
description: >-
  Install llvm-mingw and MSYS2 packages on a Debian or Ubuntu runner
  for cross builds for Windows.

inputs:
  msystem:
    description: MSYS2 environment (CLANG64, CLANGARM64 or UCRT64)
    default: CLANG64
  packages:
    description: >-
      MSYS2 packages without the prefix of the environment
      (for example "leptonica pango"), separated by white space
    default: ''
  llvm-mingw-version:
    description: Release of llvm-mingw (default see setup.sh)
    default: ''
  llvm-mingw-sha256:
    description: SHA-256 checksum of the llvm-mingw archive (optional)
    default: ''

outputs:
  host:
    description: Host triplet for the cross build, for example x86_64-w64-mingw32
    value: ${{ steps.setup.outputs.host }}
  prefix:
    description: Installation directory of the MSYS2 packages, for example /clang64
    value: ${{ steps.setup.outputs.prefix }}
  package-prefix:
    description: Prefix of the MSYS2 package names, for example mingw-w64-clang-x86_64
    value: ${{ steps.setup.outputs.package-prefix }}
  path:
    description: Directories with the cross tools (already added to PATH)
    value: ${{ steps.setup.outputs.path }}

runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      env:
        MSYSTEM: ${{ inputs.msystem }}
        PACKAGES: ${{ inputs.packages }}
        LLVM_MINGW_VERSION: ${{ inputs.llvm-mingw-version }}
        LLVM_MINGW_SHA256: ${{ inputs.llvm-mingw-sha256 }}
      run: |
        # The list of packages is split into words here.
        # shellcheck disable=SC2086
        "$GITHUB_ACTION_PATH/setup.sh" "$MSYSTEM" $PACKAGES
